<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-openai-api-key"
      data-l10n-id="pref-openai-api-key"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-openai-api-key"
      preference="openaiApiKey"
    ></html:input>
  </vbox>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-openai-model"
      data-l10n-id="pref-openai-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-openai-model"
      preference="openaiModel"
    ></html:input>
  </vbox>
  <vbox>
    <html:label data-l10n-id="pref-summary-prompts"></html:label>
    <hbox style="gap: 8px; align-items: stretch">
      <html:select
        id="zotero-prefpane-__addonRef__-summary-prompt-list"
        size="8"
        style="min-width: 180px; max-width: 240px"
      ></html:select>
      <vbox flex="1" style="gap: 6px">
        <html:label
          for="zotero-prefpane-__addonRef__-summary-prompt-name"
          data-l10n-id="pref-summary-prompt-name"
        ></html:label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-summary-prompt-name"
        ></html:input>
        <html:label
          for="zotero-prefpane-__addonRef__-summary-prompt-body"
          data-l10n-id="pref-summary-prompt-body"
        ></html:label>
        <html:textarea
          id="zotero-prefpane-__addonRef__-summary-prompt-body"
          rows="8"
          style="width: 460px"
        ></html:textarea>
        <hbox style="gap: 6px">
          <html:button
            type="button"
            id="zotero-prefpane-__addonRef__-summary-prompt-add"
            data-l10n-id="pref-summary-prompt-add"
            >Add</html:button
          >
          <html:button
            type="button"
            id="zotero-prefpane-__addonRef__-summary-prompt-delete"
            data-l10n-id="pref-summary-prompt-delete"
            >Delete</html:button
          >
        </hbox>
      </vbox>
    </hbox>
    <html:textarea
      id="zotero-prefpane-__addonRef__-summary-prompts"
      preference="summaryPrompts"
      style="display: none"
    ></html:textarea>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
